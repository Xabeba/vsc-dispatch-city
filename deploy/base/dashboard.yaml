apiVersion: apps/v1
kind: Deployment
metadata:
  name: dashboard
  namespace: food-delivery
  labels:
    app.kubernetes.io/name: dashboard
    app.kubernetes.io/part-of: food-delivery
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: dashboard
  template:
    metadata:
      labels:
        app.kubernetes.io/name: dashboard
        app.kubernetes.io/part-of: food-delivery
    spec:
      containers:
        - name: dashboard
          image: food-delivery-dashboard:local
          imagePullPolicy: IfNotPresent
          ports:
            - name: http
              containerPort: 3000
          env:
            - name: NUXT_PUBLIC_API_BASE
              value: http://localhost:8081
          readinessProbe:
            httpGet:
              path: /
              port: http
            initialDelaySeconds: 3
            periodSeconds: 5
          resources:
            requests:
              cpu: 25m
              memory: 48Mi
            limits:
              cpu: 300m
              memory: 192Mi
---
apiVersion: v1
kind: Service
metadata:
  name: dashboard
  namespace: food-delivery
  labels:
    app.kubernetes.io/name: dashboard
spec:
  selector:
    app.kubernetes.io/name: dashboard
  ports:
    - name: http
      port: 3000
      targetPort: http
