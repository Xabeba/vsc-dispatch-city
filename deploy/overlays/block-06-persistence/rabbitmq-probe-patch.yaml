apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: rabbitmq
  namespace: food-delivery
spec:
  template:
    spec:
      containers:
        - name: rabbitmq
          readinessProbe:
            timeoutSeconds: 5
            failureThreshold: 6
          livenessProbe:
            timeoutSeconds: 5
            failureThreshold: 6
