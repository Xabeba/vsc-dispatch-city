apiVersion: apps/v1
kind: Deployment
metadata:
  name: control-api
  namespace: food-delivery
spec:
  replicas: 2
  template:
    spec:
      containers:
        - name: control-api
          env:
            - name: DATABASE_URL
              valueFrom:
                secretKeyRef:
                  name: database-url
                  key: url
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: order-worker
  namespace: food-delivery
spec:
  template:
    spec:
      containers:
        - name: order-worker
          env:
            - name: DATABASE_URL
              valueFrom:
                secretKeyRef:
                  name: database-url
                  key: url
