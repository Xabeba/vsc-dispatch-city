apiVersion: v1
kind: Secret
metadata:
  name: food-delivery-db-credentials
  namespace: food-delivery
type: kubernetes.io/basic-auth
stringData:
  username: delivery
  password: delivery
---
apiVersion: v1
kind: Secret
metadata:
  name: database-url
  namespace: food-delivery
type: Opaque
stringData:
  url: postgres://delivery:delivery@food-delivery-db-rw:5432/delivery?sslmode=disable
---
apiVersion: postgresql.cnpg.io/v1
kind: Cluster
metadata:
  name: food-delivery-db
  namespace: food-delivery
  labels:
    app.kubernetes.io/name: postgres
    app.kubernetes.io/part-of: food-delivery
spec:
  instances: 2
  imageName: ghcr.io/cloudnative-pg/postgresql:18.4-system-trixie
  primaryUpdateStrategy: unsupervised
  bootstrap:
    initdb:
      database: delivery
      owner: delivery
      secret:
        name: food-delivery-db-credentials
  storage:
    size: 1Gi
    storageClass: local-path
  affinity:
    enablePodAntiAffinity: true
    topologyKey: kubernetes.io/hostname
    podAntiAffinityType: required
  resources:
    requests:
      cpu: 100m
      memory: 192Mi
    limits:
      cpu: "1"
      memory: 768Mi
  monitoring:
    enablePodMonitor: false
