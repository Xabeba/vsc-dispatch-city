apiVersion: batch/v1
kind: Job
metadata:
  name: database-migrate
  namespace: food-delivery
  labels:
    app.kubernetes.io/name: database-migrate
    app.kubernetes.io/part-of: food-delivery
spec:
  backoffLimit: 6
  ttlSecondsAfterFinished: 600
  template:
    metadata:
      labels:
        app.kubernetes.io/name: database-migrate
    spec:
      restartPolicy: OnFailure
      containers:
        - name: migrate
          image: food-delivery-migrate:local
          imagePullPolicy: IfNotPresent
          env:
            - name: DATABASE_URL
              valueFrom:
                secretKeyRef:
                  name: database-url
                  key: url
          resources:
            requests:
              cpu: 10m
              memory: 16Mi
            limits:
              cpu: 200m
              memory: 64Mi
