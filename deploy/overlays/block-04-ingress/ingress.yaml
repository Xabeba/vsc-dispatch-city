apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: food-delivery
  namespace: food-delivery
  labels:
    app.kubernetes.io/part-of: food-delivery
spec:
  ingressClassName: traefik
  rules:
    - http:
        paths:
          - path: /api
            pathType: Prefix
            backend:
              service:
                name: control-api
                port:
                  number: 8080
          - path: /health
            pathType: Prefix
            backend:
              service:
                name: control-api
                port:
                  number: 8080
          - path: /metrics
            pathType: Prefix
            backend:
              service:
                name: control-api
                port:
                  number: 8080
          - path: /
            pathType: Prefix
            backend:
              service:
                name: dashboard
                port:
                  number: 3000
