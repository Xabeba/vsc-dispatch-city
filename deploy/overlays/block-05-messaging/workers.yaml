apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: customer-simulator
  namespace: food-delivery
  labels:
    app.kubernetes.io/name: customer-simulator
    app.kubernetes.io/part-of: food-delivery
spec:
  replicas: 1
  serviceName: customer-simulator-headless
  podManagementPolicy: Parallel
  selector:
    matchLabels:
      app.kubernetes.io/name: customer-simulator
  template:
    metadata:
      labels:
        app.kubernetes.io/name: customer-simulator
        app.kubernetes.io/part-of: food-delivery
        food-delivery/entity-kind: customer
    spec:
      containers:
        - name: customer-simulator
          image: food-delivery-customer-simulator:local
          imagePullPolicy: IfNotPresent
          env:
            - name: RABBITMQ_URL
              valueFrom:
                secretKeyRef:
                  name: rabbitmq-credentials
                  key: url
            - name: ORDER_INTERVAL_MS
              value: "15000"
            - name: START_STAGGER_MS
              value: "5000"
            - name: POD_NAME
              valueFrom:
                fieldRef:
                  fieldPath: metadata.name
          ports:
            - name: http
              containerPort: 8080
          readinessProbe:
            httpGet:
              path: /health/ready
              port: http
            initialDelaySeconds: 3
            periodSeconds: 5
          livenessProbe:
            httpGet:
              path: /health/live
              port: http
            initialDelaySeconds: 8
            periodSeconds: 10
          resources:
            requests:
              cpu: 15m
              memory: 18Mi
            limits:
              cpu: 200m
              memory: 72Mi
---
