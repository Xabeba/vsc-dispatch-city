apiVersion: apps/v1
kind: Deployment
metadata:
  name: control-api
  namespace: food-delivery
spec:
  template:
    spec:
      containers:
        - name: control-api
          env:
            - name: RABBITMQ_URL
              valueFrom:
                secretKeyRef:
                  name: rabbitmq-credentials
                  key: url
          livenessProbe:
            initialDelaySeconds: 30
