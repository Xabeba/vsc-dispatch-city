apiVersion: v1
kind: Secret
metadata:
  name: rabbitmq-credentials
  namespace: food-delivery
type: Opaque
stringData:
  username: delivery
  password: delivery
  url: amqp://delivery:delivery@rabbitmq:5672/
---
apiVersion: v1
kind: Service
metadata:
  name: rabbitmq
  namespace: food-delivery
  labels:
    app.kubernetes.io/name: rabbitmq
    app.kubernetes.io/part-of: food-delivery
spec:
  selector:
    app.kubernetes.io/name: rabbitmq
  ports:
    - name: amqp
      port: 5672
      targetPort: amqp
    - name: management
      port: 15672
      targetPort: management
---
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: rabbitmq
  namespace: food-delivery
  labels:
    app.kubernetes.io/name: rabbitmq
    app.kubernetes.io/part-of: food-delivery
spec:
  serviceName: rabbitmq
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: rabbitmq
  template:
    metadata:
      labels:
        app.kubernetes.io/name: rabbitmq
        app.kubernetes.io/part-of: food-delivery
    spec:
      containers:
        - name: rabbitmq
          image: rabbitmq:4.3.5-management-alpine
          ports:
            - name: amqp
              containerPort: 5672
            - name: management
              containerPort: 15672
          env:
            - name: RABBITMQ_DEFAULT_USER
              valueFrom:
                secretKeyRef:
                  name: rabbitmq-credentials
                  key: username
            - name: RABBITMQ_DEFAULT_PASS
              valueFrom:
                secretKeyRef:
                  name: rabbitmq-credentials
                  key: password
          readinessProbe:
            exec:
              command: [rabbitmq-diagnostics, -q, check_running]
            initialDelaySeconds: 8
            periodSeconds: 5
          livenessProbe:
            exec:
              command: [rabbitmq-diagnostics, -q, ping]
            initialDelaySeconds: 20
            periodSeconds: 10
          resources:
            requests:
              cpu: 100m
              memory: 256Mi
            limits:
              cpu: "1"
              memory: 768Mi
          volumeMounts:
            - name: data
              mountPath: /var/lib/rabbitmq
  volumeClaimTemplates:
    - metadata:
        name: data
      spec:
        accessModes:
          - ReadWriteOnce
        resources:
          requests:
            storage: 1Gi
